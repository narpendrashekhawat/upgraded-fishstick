<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Wave blue gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#93C5FD" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="90%" stop-color="#93C5FD" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Flowing filled ribbon 1 -->
  <path d="M -50 200 C 150 150 250 320 500 280 C 750 240 900 200 1250 240 L 1250 400 L -50 400 Z" fill="url(#waveGrad1)"/>

  <!-- Flowing filled ribbon 2 -->
  <path d="M -50 240 C 200 180 300 300 550 250 C 800 200 950 260 1250 220 L 1250 400 L -50 400 Z" fill="url(#waveGrad2)"/>

